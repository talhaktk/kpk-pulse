<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPK Pulse — Real-Time Media Intelligence</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Breaking News Banner -->
  <div id="breaking-banner" class="breaking-banner hidden">
    <span class="breaking-label">⚡ BREAKING</span>
    <div id="breaking-ticker" class="ticker-wrap">
      <div id="breaking-text" class="ticker-text"></div>
    </div>
    <button onclick="closeBanner()" class="close-banner">✕</button>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📡</span>
        <div>
          <h1>KPK Pulse</h1>
          <p>Real-Time KPK Media Intelligence</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <input type="text" id="search-input" placeholder="Search stories…" autocomplete="off" />
          <button id="search-btn" onclick="searchNews()">🔍</button>
        </div>
        <div id="status-dots" class="status-dots" title="API status"></div>
        <div id="last-updated" class="last-updated">—</div>
        <button class="btn-refresh" onclick="refreshAll()" title="Refresh">↻</button>
      </div>
    </div>
  </header>

  <!-- Filters Bar -->
  <div class="filters-bar">
    <div class="filter-group">
      <label>Source</label>
      <select id="filter-source" onchange="applyFilters()">
        <option value="">All Sources</option>
        <option value="Dawn">Dawn</option>
        <option value="Geo News">Geo News</option>
        <option value="ARY News">ARY News</option>
        <option value="Express Tribune">Express Tribune</option>
        <option value="NewsAPI">NewsAPI</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Region</label>
      <select id="filter-region" onchange="applyFilters()">
        <option value="">All Regions</option>
        <option value="Peshawar">Peshawar</option>
        <option value="Swat">Swat</option>
        <option value="Mardan">Mardan</option>
        <option value="Abbottabad">Abbottabad</option>
        <option value="Nowshera">Nowshera</option>
        <option value="Bannu">Bannu</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Date</label>
      <select id="filter-date" onchange="applyFilters()">
        <option value="">All Time</option>
        <option value="1h">Last 1 hour</option>
        <option value="6h">Last 6 hours</option>
        <option value="24h">Last 24 hours</option>
      </select>
    </div>
    <button class="btn-clear-filters" onclick="clearFilters()">Clear</button>
  </div>

  <!-- Tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="all" onclick="switchTab('all', this)">🏠 All News</button>
    <button class="tab" data-tab="news" onclick="switchTab('news', this)">📰 Google News</button>
    <button class="tab" data-tab="newspapers" onclick="switchTab('newspapers', this)">🗞️ Newspapers</button>
    <button class="tab" data-tab="youtube" onclick="switchTab('youtube', this)">▶️ YouTube</button>
    <button class="tab" data-tab="trends" onclick="switchTab('trends', this)">📈 Trends</button>
    <button class="tab" data-tab="social" onclick="switchTab('social', this)">💬 Social Media</button>
    <button class="tab" data-tab="bookmarks" onclick="switchTab('bookmarks', this)">🔖 Bookmarks</button>
  </nav>

  <!-- Main Content -->
  <main class="main">

    <!-- All News Tab -->
    <div id="tab-all" class="tab-content active">
      <div class="section-header">
        <h2>All Stories <span id="all-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-all"></div>
      </div>
      <div id="all-grid" class="card-grid"></div>
      <button id="load-more-all" class="btn-load-more hidden" onclick="loadMore('all')">Load More</button>
    </div>

    <!-- Google News Tab -->
    <div id="tab-news" class="tab-content hidden">
      <div class="section-header">
        <h2>Google News <span id="news-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-news"></div>
      </div>
      <div id="news-grid" class="card-grid"></div>
    </div>

    <!-- Newspapers Tab -->
    <div id="tab-newspapers" class="tab-content hidden">
      <div class="section-header">
        <h2>Newspaper RSS <span id="newspapers-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-newspapers"></div>
      </div>
      <div id="newspapers-grid" class="card-grid"></div>
    </div>

    <!-- YouTube Tab -->
    <div id="tab-youtube" class="tab-content hidden">
      <div class="section-header">
        <h2>YouTube Channels <span id="youtube-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-youtube"></div>
      </div>
      <div id="youtube-grid" class="card-grid youtube-grid"></div>
    </div>

    <!-- Trends Tab -->
    <div id="tab-trends" class="tab-content hidden">
      <div class="section-header">
        <h2>Google Trends — Pakistan <span id="trends-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-trends"></div>
      </div>
      <div id="trends-list" class="trends-list"></div>
    </div>

    <!-- Social Media Tab -->
    <div id="tab-social" class="tab-content hidden">
      <div class="section-header">
        <h2>Social Media <span id="social-count" class="count-badge">—</span></h2>
        <div class="loading-spinner hidden" id="spinner-social"></div>
      </div>
      <div id="social-grid" class="card-grid"></div>
    </div>

    <!-- Bookmarks Tab -->
    <div id="tab-bookmarks" class="tab-content hidden">
      <div class="section-header">
        <h2>Bookmarked Stories <span id="bookmarks-count" class="count-badge">0</span></h2>
      </div>
      <div id="bookmarks-grid" class="card-grid"></div>
      <div id="bookmarks-empty" class="empty-state">
        <p>🔖 No bookmarks yet. Click the bookmark icon on any story to save it.</p>
      </div>
    </div>

  </main>

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <!-- API Status Sidebar -->
  <div id="api-modal" class="modal hidden">
    <div class="modal-box">
      <h3>API Configuration Status</h3>
      <div id="api-status-list"></div>
      <button onclick="closeModal()" class="btn-close-modal">Close</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
